name: VibeTypeMac
options:
  bundleIdPrefix: com.vibetype
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: ko
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_ENTITLEMENTS: VibeTypeMac/VibeTypeMac.entitlements
    ENABLE_HARDENED_RUNTIME: YES
    PRODUCT_NAME: VibeType
    INFOPLIST_KEY_LSUIElement: YES
    INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 VibeType"
    INFOPLIST_KEY_CFBundleDisplayName: VibeType
    INFOPLIST_KEY_NSAccessibilityUsageDescription: "VibeType은 받아쓰기 결과를 포커스된 앱에 직접 입력하기 위해 Accessibility 권한이 필요합니다."
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "VibeType은 음성 받아쓰기를 위해 마이크 접근 권한이 필요합니다. 음성은 모두 사용자의 Mac에서 로컬로 처리되며 외부에 전송되지 않습니다."

packages:
  VibeTypeCore:
    path: ../..
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.2.0

targets:
  VibeTypeMac:
    type: application
    platform: macOS
    sources:
      - path: VibeTypeMac
        excludes:
          - "VibeTypeMac.entitlements"
    dependencies:
      - package: VibeTypeCore
        product: VibeTypeCore
      - package: KeyboardShortcuts
        product: KeyboardShortcuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vibetype.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
schemes:
  VibeTypeMac:
    build:
      targets:
        VibeTypeMac: all
    run:
      config: Debug
