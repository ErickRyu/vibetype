name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (예: v0.1.0)'
        required: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain info
        run: |
          xcodebuild -version
          swift --version

      - name: Determine signing availability
        id: signing
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_APP: ${{ secrets.DEVELOPER_ID_APP }}
        run: |
          if [ -n "$MACOS_CERTIFICATE_BASE64" ] && [ -n "$DEVELOPER_ID_APP" ]; then
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Install build tools
        run: brew install xcodegen create-dmg

      - name: Import Developer ID certificate
        if: steps.signing.outputs.has_signing == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      - name: Build (signed + notarized)
        if: steps.signing.outputs.has_signing == 'true'
        env:
          DEVELOPER_ID_APP: ${{ secrets.DEVELOPER_ID_APP }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./scripts/release.sh --sign --notarize

      - name: Build (unsigned, fallback)
        if: steps.signing.outputs.has_signing != 'true'
        run: ./scripts/release.sh

      - name: Generate release notes from CHANGELOG
        id: notes
        env:
          HAS_SIGNING: ${{ steps.signing.outputs.has_signing }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="${GITHUB_REF_NAME:-$INPUT_VERSION}"
          VERSION_NUMBER="${VERSION#v}"
          awk -v v="$VERSION_NUMBER" '
            $0 ~ "^## \\[" v "\\]" { flag=1; next }
            /^## / { flag=0 }
            flag
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "VibeType $VERSION" > release-notes.md
          fi
          if [ "$HAS_SIGNING" != "true" ]; then
            cat >> release-notes.md <<'EOF'

---

⚠️ **이 빌드는 코드 사인되지 않았습니다.** 처음 열 때 우클릭 → "열기" 또는 System Settings → Privacy & Security에서 "그래도 열기"를 눌러야 합니다.
EOF
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.version }}
          name: VibeType ${{ steps.notes.outputs.version }}
          body_path: release-notes.md
          files: dist/VibeType.dmg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
